set -g default-terminal "screen-256color"

# 1. 기존 Prefix (Ctrl+b) 해제
unbind C-b

# 2. 새 Prefix를 Ctrl+a 로 설정
set -g prefix C-a

# 3. Ctrl+a 두 번 누르면 터미널 내 앱(Bash, Vim 등)으로 Ctrl+a 전달하기
# (이게 없으면 쉘에서 '라인 맨 앞으로 이동' 기능을 못 씁니다)
bind C-a send-prefix

# 1. Vi 모드 활성화 (이미 되어 있을 수도 있음)
set-window-option -g mode-keys vi

# 2. 'v' 로 Visual Mode 시작 (블록 지정)
bind -T copy-mode-vi v send-keys -X begin-selection

# [Linux - X11] (xclip 설치 필요: sudo apt install xclip)
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Prefix + h 로 이전 탭(Window) 이동 (반복 가능)
bind -r h previous-window

# Prefix + l 로 다음 탭(Window) 이동 (반복 가능)
bind -r l next-window

# 현재 pane의 경로를 유지
set-option -g default-command "exec zsh"
set-option -g update-environment "PWD"

# 수직 분할 시 현재 pane의 경로 유지
bind-key '"' split-window -c "#{pane_current_path}"

# 수평 분할 시 현재 pane의 경로 유지
bind-key % split-window -h -c "#{pane_current_path}"
